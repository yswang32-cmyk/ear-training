<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>音痴計畫・耳朵訓練場</title>
<style>
:root{--bg:#f6f3ee;--fg:#22201c;--mut:#6f6a60;--card:#ffffff;--line:#ddd6c8;--ok:#2f8f4e;--bad:#c93c3c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--fg:#f0ece4;--mut:#a39d90;--card:#212126;--line:#37373e;--ok:#5cc47c;--bad:#f07272}}
:root[data-theme="dark"]{--bg:#17171a;--fg:#f0ece4;--mut:#a39d90;--card:#212126;--line:#37373e;--ok:#5cc47c;--bad:#f07272}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 "PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:26px;margin:0 0 2px;letter-spacing:.02em}
.sub{color:var(--mut);margin:0 0 18px;font-size:14px}
nav{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto}
nav button,.seg button{flex:1;min-width:62px;padding:10px 6px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;font:inherit;cursor:pointer}
nav button[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.stats{display:flex;gap:16px;color:var(--mut);font-size:14px;margin-bottom:12px}
.stats b{color:var(--fg)}
.keys{display:flex;gap:6px;align-items:flex-end;margin:14px 0}
.key{flex:1;border:0;border-radius:10px 10px 6px 6px;background:var(--c);color:#fff;font:600 15px/1.2 inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 0 10px;transition:transform .08s,filter .08s;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.key small{font-weight:400;opacity:.85;margin-top:2px}
.key:active,.key.on{transform:translateY(3px);filter:brightness(1.18)}
.key:disabled{opacity:.5}
.keys.x{gap:3px}.keys.x .key{font-size:15px;padding-bottom:8px}.keys.x small{font-size:10px}
@media(max-width:520px){.keys.x small{display:none}}
.btn.on{background:var(--fg);color:var(--bg)}
.pk{position:relative;display:flex;height:170px;margin:14px 0;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.pk .w{flex:1;min-width:0;border:1px solid #8a8578;border-top:0;border-radius:0 0 8px 8px;background:#fbfaf6;color:#222;text-shadow:none;padding:0 0 12px;box-shadow:inset 0 -6px 0 var(--c);font-weight:600;font-size:14px;line-height:1.2;font-family:inherit}
.pk .w small{color:#666;font-size:11px}
.pk .b{position:absolute;top:0;height:60%;z-index:2;padding:0;border:0;border-radius:0 0 6px 6px;background:#1c1c1f;box-shadow:inset 0 -7px 0 #4a4a50}
.pk .w:active,.pk .w.on{background:var(--c);color:#fff;filter:none}
.pk .w.on small,.pk .w:active small{color:#fff}
.pk .b:active,.pk .b.on{background:var(--c);filter:none;transform:none}
.pk.x .w{font-size:12px;padding-bottom:10px}
.seg{display:flex;gap:6px;margin-bottom:10px}
@media(max-width:520px){.pk.x small{display:none}}
.gt{display:grid;grid-template-columns:repeat(13,1fr);margin:14px 0 2px;background:#d8c7a0;border-radius:8px;overflow:hidden;border:1px solid #8a7a55}
.gt .f{position:relative;height:32px;min-width:0;padding:0;border:0;border-right:2px solid #b3a37c;background:transparent;display:flex;align-items:center;justify-content:center;border-radius:0;transform:none;filter:none;opacity:1;cursor:pointer}
.gt .f:disabled{cursor:default}
.gt .f.o{border-right:4px solid #3a3326}
.gt .f::before{content:'';position:absolute;left:0;right:0;top:50%;height:var(--t);margin-top:calc(var(--t)/-2);background:#6b6249}
.gt .f i{position:relative;z-index:1;width:21px;height:21px;border-radius:50%;background:var(--c);color:#fff;font:600 11px/21px sans-serif;font-style:normal;text-align:center;text-shadow:none}
.gt .f i.s{background:#2a2a2e}
.gt .f.on i,.gt .f:active i{outline:3px solid #222}
.gn{display:grid;grid-template-columns:repeat(13,1fr);font-size:10px;color:var(--mut);text-align:center;margin-bottom:14px}
.gn .m{color:var(--fg);font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.btn{padding:11px 16px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;font:inherit;cursor:pointer;flex:1;min-width:110px}
.btn.main{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.fb{min-height:28px;font-weight:600;margin:6px 0}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
p.hint{color:var(--mut);font-size:14px;margin:6px 0}
.meter{position:relative;height:56px;margin:18px 0 8px;border-radius:12px;background:linear-gradient(90deg,var(--bad) 0,transparent 30%,var(--ok) 42%,var(--ok) 58%,transparent 70%,var(--bad) 100%);opacity:.9}
.meter i{position:absolute;top:-6px;bottom:-6px;width:6px;margin-left:-3px;border-radius:3px;background:var(--fg);left:50%;transition:left .08s}
.meter span{position:absolute;top:100%;font-size:12px;color:var(--mut)}
.big{font-size:34px;font-weight:700;text-align:center;margin:4px 0}
.btn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.rpg{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px}
.rt{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:15px}.rt span{color:var(--mut);font-size:13px}
.xp{height:8px;border-radius:4px;background:var(--line);margin-top:6px;overflow:hidden}.xp i{display:block;height:100%;background:linear-gradient(90deg,#e8811f,#e5484d);transition:width .4s}
.rm{min-height:22px;margin:-4px 2px 10px;font-size:14px;color:var(--mut)}
.fix{border:2px solid var(--bad);border-radius:12px;padding:12px;margin:8px 0}.fix p{margin:8px 0;line-height:1.9}.fix .bad{color:var(--bad);font-weight:700}.fix .okc{color:var(--ok);font-weight:700}
#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;z-index:50;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;max-width:86%}
#toast.big{font-size:20px;padding:20px 26px;top:30%;line-height:1.6}
body.land{overflow:hidden}
@media (orientation:landscape){body.land main{max-width:none}}
@media (orientation:portrait){body.land main{position:fixed;top:0;left:0;width:100vh;height:100vw;max-width:none;transform-origin:top left;transform:translateX(100vw) rotate(90deg);overflow:auto}}
body.land .pk{height:140px}body.land .gt .f{height:26px}
button:focus-visible{outline:3px solid #3b5bdb;outline-offset:2px}
</style>
</head>
<body>
<main>
<h1>耳朵訓練場</h1>
<p class="sub">不看五線譜，只用耳朵。越往右的鍵，音越高。建議戴耳機或調大音量。</p>
<div class="seg" id="inst"><button data-inst="piano" aria-pressed="true">🎹 鋼琴</button><button data-inst="guitar" aria-pressed="false">🎸 吉他</button><button data-land="1" aria-pressed="false">⟳ 橫向</button></div>
<nav id="tabs"></nav>
<div class="rpg" id="rpg"></div><div class="rm" id="rmsg"></div>
<section class="card" id="view"></section>
</main>
<script>
const N=[['Do',0,'#e5484d','1'],['Re',2,'#e8811f','2'],['Mi',4,'#c99a06','3'],['Fa',5,'#3f9d4f','4'],['Sol',7,'#1f9bb0','5'],['La',9,'#3b5bdb','6'],['Ti',11,'#8e4ec6','7'],['高Do',12,'#e5484d','1↑']];
/* 吉他音色：Karplus-Strong 弦振動物理模型 + 琴身共鳴 + 房間殘響 */
const GC={};let GB=null;
function ksBuf(f){const c=A(),sr=c.sampleRate,k=sr+'|'+f.toFixed(1);if(GC[k])return GC[k];
const D=sr/f-.5,N=Math.floor(D),fr=D-N,a=(1-fr)/(1+fr),len=Math.floor(sr*3.2),b=c.createBuffer(1,len,sr),y=b.getChannelData(0);
const T=Math.max(1.4,4-f/350),g=Math.pow(10,-3/(f*T)),w=new Float32Array(N+1),pk=Math.max(1,Math.round(N*.13));
for(let i=0;i<=N;i++)w[i]=Math.random()*2-1;
let pv=0,mx=0,mean=0;for(let i=0;i<=N;i++){const x=w[i]-w[(i+N+1-pk)%(N+1)];pv=pv*.35+x*.65;y[i]=pv;mean+=pv}
mean/=N+1;for(let i=0;i<=N;i++){y[i]-=mean;mx=Math.max(mx,Math.abs(y[i]))}for(let i=0;i<=N;i++)y[i]/=mx;
let v1=0,u1=0;for(let n=N+1;n<len;n++){const v=g*.5*(y[n-N]+y[n-N-1]),u=a*(v-u1)+v1;v1=v;u1=u;y[n]=u}
let m=0;for(let n=0;n<len;n++)m=Math.max(m,Math.abs(y[n]));for(let n=0;n<len;n++)y[n]/=m;
return GC[k]=b}
function gOut(){const c=A();if(GB&&GB.c===c)return GB.n;
const P=(fr,q,gn)=>{const x=c.createBiquadFilter();x.type='peaking';x.frequency.value=fr;x.Q.value=q;x.gain.value=gn;return x};
const a=P(105,1.2,5),b=P(230,2,3),l=c.createBiquadFilter();l.type='lowpass';l.frequency.value=6000;
const cv=c.createConvolver(),n=Math.floor(c.sampleRate*.6),ir=c.createBuffer(2,n,c.sampleRate);
for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3)}
cv.buffer=ir;const wet=c.createGain();wet.gain.value=.18;
a.connect(b);b.connect(l);l.connect(c.destination);l.connect(cv);cv.connect(wet);wet.connect(c.destination);
GB={c,n:a};return a}
function gtone(semi,d,off,vol,quiet){const c=A(),t=c.currentTime+.04,f=261.63*Math.pow(2,(semi+off)/12),s=c.createBufferSource(),g=c.createGain(),ring=Math.max(d*1.8,.9),pv=Math.min(1,vol*1.6);
s.buffer=ksBuf(f);g.gain.setValueAtTime(pv,t);g.gain.setValueAtTime(pv,t+ring-.35);g.gain.linearRampToValueAtTime(0,t+ring);
s.connect(g).connect(gOut());s.start(t);s.stop(t+ring+.05);if(!quiet)flash(semi);return wait(d*1000+150)}
const PC=['Do','Do♯','Re','Re♯','Mi','Fa','Fa♯','Sol','Sol♯','La','La♯','Ti'];
const NAME=s=>(s<0?'低':s>=12?'高':'')+PC[((s%12)+12)%12];
let inst='piano',ctx,mode='play',busy=false,st={streak:0,ok:0,total:0,level:1},q=null,mic=null,raf=0;
const $=s=>document.querySelector(s);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function A(){ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state!=='running')ctx.resume();return ctx}
function tone(semi,d=.8,off=0,vol=.35,quiet=0){if(inst==='guitar')return gtone(semi,d,off,vol,quiet);const c=A(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime+.04;
o.type=inst==='guitar'?'sawtooth':'triangle';o.frequency.value=261.63*Math.pow(2,(semi+off)/12);
g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(inst==='guitar'?vol*.6:vol,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+d);
if(inst==='guitar'){const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=1600;o.connect(f).connect(g)}else o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.05);
if(!quiet)flash(semi);return wait(d*1000+150)}
function flashOld(s){let b=document.querySelector('.key[data-s="'+s+'"]'),sh=0;if(!b&&mode==='song'){b=document.querySelector('.key[data-s="'+(s-1)+'"]');sh=1}
if(b){b.classList.add('on');setTimeout(()=>b.classList.remove('on'),300)}
if(sh){const m=$('#sharp');if(m){m.classList.add('on');setTimeout(()=>m.classList.remove('on'),300)}}}
function keysOld(act,pool){return '<div class="keys">'+N.map((n,i)=>(!pool||pool.includes(n[1]))?
'<button class="key" data-act="'+act+'" data-s="'+n[1]+'" style="--c:'+n[2]+';height:'+(64+i*16)+'px">'+n[0]+'<small>'+n[3]+'</small></button>':'').join('')+'</div>'}
function stats(){const p=st.total?Math.round(st.ok/st.total*100):0;
return '<div class="stats"><span>連對 <b>'+st.streak+'</b></span><span>正確率 <b>'+p+'%</b></span><span>等級 <b>'+st.level+'/'+(mode==='melody'?4:3)+'</b></span></div>'}
/* RPG 獎勵 */
const TI=[[0,'音痴見習生'],[60,'初聞音律的旅人'],[160,'耳朵學徒'],[340,'旋律探險家'],[620,'音階遊俠'],[1000,'和聲騎士'],[1600,'旋律魔法師'],[2500,'音律大賢者'],[4000,'耳朵宗師'],[6500,'傳說・天籟之耳']];
const PR=['太棒了！耳朵很靈敏！','答對了，你的音感正在長大！','漂亮！這個音被你抓到了！','聽得好準，繼續保持！','Nice！旋律乖乖聽你的話！'],
ER=['沒關係，每次聽錯都讓耳朵更強一點。','差一點點而已，你已經很接近了！','願意再試就是進步，加油！','音感是練出來的，你正在路上！'],
LU=['你的耳朵又進化了！','一步一步，你正在變成會聽音樂的人。','這份堅持，真的很了不起！','這個新稱號，是你自己練出來的！'],
SK={3:'連對 3 題！手感來了 🔥',5:'連對 5 題！耳朵開掛了 ✨',10:'連對 10 題！你是音樂小天才 🌟',20:'連對 20 題！傳說級的耳朵 👑'};
let R={xp:0,ok:0,total:0,best:0,run:0};
try{R=Object.assign(R,JSON.parse(localStorage.getItem('rpg')||'{}'))}catch(e){}
const sv=()=>{try{localStorage.setItem('rpg',JSON.stringify(R))}catch(e){}};
const lvOf=x=>{let i=0;TI.forEach((t,k)=>{if(x>=t[0])i=k});return i};
const epi=()=>R.total<10?'新手上路':R.ok/R.total>=.9?'百發百中':R.ok/R.total>=.75?'穩紮穩打':R.ok/R.total>=.5?'漸入佳境':'勇敢嘗試';
function drawRpg(){const e=$('#rpg');if(!e)return;const i=lvOf(R.xp),a=TI[i][0],b=TI[i+1]?TI[i+1][0]:a,p=b>a?Math.min(100,(R.xp-a)/(b-a)*100):100;
e.innerHTML='<div class="rt"><b>Lv.'+(i+1)+' '+TI[i][1]+'</b><span>'+epi()+(R.total?'・正確率 '+Math.round(R.ok/R.total*100)+'%':'')+'・XP '+R.xp+(b>a?'/'+b:'')+'</span></div><div class="xp"><i style="width:'+p+'%"></i></div>'}
function toast(t,big){let e=$('#toast');if(!e){e=document.createElement('div');e.id='toast';document.querySelector('main').appendChild(e)}e.className=big?'big':'';e.innerHTML=t;e.style.opacity=1;clearTimeout(e._t);e._t=setTimeout(()=>{e.style.opacity=0},big?3400:1800)}
function lvChk(o){const n=lvOf(R.xp);if(n>o)toast('🎉 升級到 Lv.'+(n+1)+'<br>「'+TI[n][1]+'」<br><small>'+pick(LU)+'</small>',1)}
function bonus(x,t){const o=lvOf(R.xp);R.xp+=x;sv();drawRpg();toast(t);lvChk(o)}
function rpg(ok,pts){const o=lvOf(R.xp);R.total++;R.run=ok?(R.run||0)+1:0;let g=2;
if(ok){R.ok++;R.best=Math.max(R.best||0,R.run);g=pts+Math.min(10,Math.floor(R.run/3)*2)}
R.xp+=g;sv();drawRpg();const m=$('#rmsg');if(m)m.textContent=(ok?pick(PR):pick(ER))+'　+'+g+' XP';
if(ok&&SK[R.run])toast(SK[R.run]);lvChk(o)}
/* 答錯修正畫面 */
let fx=null;
const clrFix=()=>{const f=$('#fix');if(f)f.remove()};
function showFix(user,right,base){fx={user,right,base:base||0};clrFix();
const row=(a,c)=>a.map((x,i)=>'<span class="'+(c&&c[i]!==x?'bad':'')+'">'+NAME(x)+'</span>').join(' ');
const h='<div id="fix" class="fix"><b>'+pick(ER)+'</b><p>正確：<span class="okc">'+row(right)+'</span><br>你的：'+row(user,right)+'</p><div class="row"><button class="btn" data-act="fplay" data-s="0">聽我的</button><button class="btn" data-act="fplay" data-s="1">聽正確的</button><button class="btn" data-act="fplay" data-s="2">對照播放</button></div><div class="row"><button class="btn" data-act="fretry">再試一次</button><button class="btn main" data-act="fnext">下一題</button></div></div>';
const k=document.querySelector('.pk')||document.querySelector('.gn')||$('#fb');if(k)k.insertAdjacentHTML('afterend',h);
const f=$('#fix');if(f&&f.scrollIntoView)f.scrollIntoView({block:'nearest',behavior:'smooth'})}
async function fPlay(w){if(busy||!fx)return;busy=true;const pl=async a=>{for(const s of a)await tone(s,.6,fx.base)};
if(w===0)await pl(fx.user);else if(w===1)await pl(fx.right);else{await pl(fx.user);await wait(500);await pl(fx.right)}busy=false}
function fRetry(){if(busy)return;clrFix();
if(mode==='name'){q.done=0;playQ()}
else if(mode==='melody'){mel.att=[];mel.done=0;rAtt();fb('聽…');busy=true;playMel().then(()=>{busy=false;fb('再試一次。')})}
else songStart(1)}
function fNext(){if(busy)return;clrFix();
if(mode==='name')newQ();else if(mode==='melody')newMel();
else{const n=sList()[sg.i].ph.length;if(sg.p>=0&&sg.p<n-1){sg.p++;rSong();songStart()}else songStart(1)}}
const lvRow=()=>'<div class="row">'+[1,2,3,4].map(n=>'<button class="btn" style="min-width:0;flex:1" data-act="mlv" data-s="'+n+'" aria-pressed="'+(n===st.level)+'">等級 '+n+'</button>').join('')+'</div><p class="hint">'+['3 個音：Do Mi Sol','3 個音：Do 到 Sol','4 個音：全部 8 個音','5 個音：全部 8 個音'][st.level-1]+'</p>';
const WH=[0,2,4,5,7,9,11],NM={0:0,2:1,4:2,5:3,7:4,9:5,11:6};
function piano(act,lo,hi,pool,blk){const ws=[],P=s=>((s%12)+12)%12;
for(let s=lo;s<=hi;s++)if(WH.includes(P(s)))ws.push(s);
const w=100/ws.length,bw=w*.62;
let h='<div class="pk'+(ws.length>9?' x':'')+'">';
ws.forEach(s=>{const n=N[NM[P(s)]],d=s<0?'\u0323':s>=12?'\u0307':'';
h+='<button class="key w" data-act="'+act+'" data-s="'+s+'" style="--c:'+n[2]+'"'+(pool&&!pool.includes(s)?' disabled':'')+'>'+n[3]+d+'<small>'+NAME(s)+'</small></button>'});
for(let s=lo+1;s<hi;s++){const i=ws.indexOf(s-1);if(!WH.includes(P(s))&&i>=0&&ws.includes(s+1))
h+='<button class="key b" data-act="'+act+'" data-s="'+s+'" aria-label="'+NAME(s)+'" style="--c:'+N[NM[P(s-1)]][2]+';left:'+((i+1)*w-bw/2)+'%;width:'+bw+'%"'+(blk?'':' disabled')+'></button>'}
return h+'</div>'}
const GS=[4,-1,-5,-10,-15,-20],GT=[1.5,2,2.5,3.5,4.5,5.5];
function guitar(act,lo,hi,pool,blk){const P=s=>((s%12)+12)%12;let h='<div class="gt">';
GS.forEach((o,r)=>{for(let f=0;f<=12;f++){const s=o+f,pc=P(s),dia=WH.includes(pc),ok=s>=lo&&s<=hi&&(dia?(!pool||pool.includes(s)):blk),d=s<0?'\u0323':s>=12?'\u0307':'';
h+='<button class="key f'+(f===0?' o':'')+'" data-act="'+act+'" data-s="'+s+'" style="--t:'+GT[r]+'px'+(dia?';--c:'+N[NM[pc]][2]:'')+'"'+(ok?'':' disabled')+'>'+(ok?'<i'+(dia?'':' class="s"')+'>'+(dia?N[NM[pc]][3]+d:'\u266f'+N[NM[P(s-1)]][3])+'</i>':'')+'</button>'}});
h+='</div><div class="gn">';for(let f=0;f<=12;f++)h+='<span'+([3,5,7,9,12].includes(f)?' class="m"':'')+'>'+f+'</span>';
return h+'</div>'}
function flash(s){document.querySelectorAll('.key[data-s="'+s+'"]').forEach(b=>{b.classList.add('on');setTimeout(()=>b.classList.remove('on'),300)})}
function syncInst(){document.querySelectorAll('#inst button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.inst===inst))}
function setInst(v){const c=$('#cust');if(c)sg.txt=c.value;inst=v;try{localStorage.setItem('inst',v)}catch(e){}syncInst();render()}
function keys(act,pool){const b=act==='play'||act==='target';return inst==='guitar'?guitar(act,0,12,pool,b):piano(act,0,12,pool,b)}
function xkeys(){return inst==='guitar'?guitar('mkey',-5,16,null,1):piano('mkey',-5,16,null,1)}
const TABS=[['play','試聽'],['pitch','高低'],['name','辨音'],['melody','彈旋律'],['song','歌曲'],['sing','跟唱']];
function tabs(){$('#tabs').innerHTML=TABS.map(t=>'<button data-tab="'+t[0]+'" aria-pressed="'+(t[0]===mode)+'">'+t[1]+'</button>').join('')}
function setMode(m){stopMic();mode=m;st={streak:0,ok:0,total:0,level:1};q=null;busy=false;tabs();render()}
function render(){
const v=$('#view');
if(mode==='play'){v.innerHTML='<p class="hint">先熟悉 8 個音。點色塊聽聽看，從低到高唱一遍：Do Re Mi Fa Sol La Ti 高Do。</p>'+keys('play')+
'<div class="row"><button class="btn main" data-act="scale">自動播放音階</button></div>'}
else if(mode==='pitch'){v.innerHTML=stats()+'<p class="hint">會連續播兩個音，判斷第二個音比第一個高、低，還是一樣。</p><div class="fb" id="fb"></div>'+
'<div class="row"><button class="btn" data-act="up">第二個較高 ↑</button><button class="btn" data-act="down">第二個較低 ↓</button><button class="btn" data-act="same">一樣 =</button></div>'+
'<div class="row"><button class="btn main" data-act="next">播放新題目</button><button class="btn" data-act="replay">再聽一次</button></div>'}
else if(mode==='melody'){rMel()}
else if(mode==='song'){rSong()}
else if(mode==='name'){const pool=[[0,7,12],[0,4,7,12],[0,2,4,5,7,9,11,12]][st.level-1];
v.innerHTML=stats()+'<p class="hint">先播基準音 Do，再播一個目標音。選出目標是哪個音。</p><div class="fb" id="fb"></div>'+keys('guess',pool)+
'<div class="row"><button class="btn main" data-act="next">播放新題目</button><button class="btn" data-act="replay">再聽一次</button></div>'}
else{v.innerHTML='<p class="hint">選一個目標音，聽完後按開始，用「啊」唱出來。指針在綠色中間就算準，不分八度，男女生都能唱。</p>'+keys('target')+
'<div class="big" id="tg">目標：Do</div><div class="meter"><i id="nd"></i><span style="left:2%">偏低</span><span style="right:2%">偏高</span></div>'+
'<div class="fb" id="fb">按下開始後允許麥克風。</div><div class="row"><button class="btn main" data-act="mic">開始唱</button><button class="btn" data-act="stop">停止</button></div>'}}
function fb(t,c){const e=$('#fb');if(e){e.textContent=t;e.className='fb '+(c||'')}}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
async function playQ(){if(mode==='melody'){busy=true;await playMel();busy=false;return}busy=true;
if(mode==='pitch'){await tone(q.a,.7);await wait(200);await tone(q.b,.7)}
else{fb('基準音 Do…');await tone(0,.7,0,.35,1);await wait(350);fb('目標音是？');await tone(q.t,.9,0,.35,1)}
busy=false}
function newQ(){if(mode==='melody'){newMel();return}
if(mode==='pitch'){const iv=[[7,12,5],[4,3,2],[1,2]][st.level-1];const a=pick([-5,-3,0,2,4,5,7]);
if(st.level>1&&Math.random()<.2)q={a,b:a,ans:'same'};else{const d=pick(iv),up=Math.random()<.5;q={a,b:up?a+d:a-d,ans:up?'up':'down'}}}
else{q={t:pick([[0,7,12],[0,4,7,12],[0,2,4,5,7,9,11,12]][st.level-1]),done:0}}
clrFix();fb('');playQ()}
function answer(ok,msg){rpg(ok,mode==='melody'?12+6*st.level:8+4*st.level);st.total++;if(ok){st.ok++;st.streak++;if(mode!=='melody'&&st.streak%5===0&&st.level<3)st.level++}else st.streak=0;
const lv=st.level;const old=$('.stats');if(old)old.outerHTML=stats();
fb((ok?'答對了！':'再聽聽看。')+msg,ok?'ok':'bad');
if(mode==='name'&&lv!==+document.body.dataset.lv){document.body.dataset.lv=lv;render();fb('升級到等級 '+lv+'！','ok')}}
async function guess(s){if(busy||!q)return;if(q.done)return;
if(s===q.t){q.done=1;answer(true,'是 '+NAME(s)+'。');await wait(900);newQ()}
else{q.done=1;answer(false,'正確答案是 '+NAME(q.t)+'，你選的是 '+NAME(s)+'。');showFix([s],[q.t],0);busy=true;await tone(s,.7);await wait(300);await tone(q.t,.8);busy=false}}
async function pitchAns(a){if(busy||!q||q.done)return;q.done=1;const ok=a===q.ans;
answer(ok,ok?'':'正確答案是'+({up:'較高',down:'較低',same:'一樣'})[q.ans]+'。');await wait(1200);newQ()}
/* 彈旋律 */
let mel={notes:[],att:[],base:0,done:1};
const MP=[[0,4,7],[0,2,4,5,7],[0,2,4,5,7,9,11,12],[0,2,4,5,7,9,11,12]],ML=[3,3,4,5];
function rMel(){$('#view').innerHTML=stats()+lvRow()+'<p class="hint">每題的調會隨機變。先聽一個 Do-Mi-Sol 和弦當基準，再聽旋律，然後用色塊把它彈出來。聽的時候色塊不會亮，全靠耳朵。</p><div class="big" id="att"></div><div class="fb" id="fb"></div>'+keys('mkey',MP[st.level-1])+'<div class="row"><button class="btn main" data-act="next">播放新題目</button><button class="btn" data-act="replay">再聽旋律</button></div><div class="row"><button class="btn" data-act="mbase">再聽基準和弦</button><button class="btn" data-act="mclear">清除重彈</button></div>';mel={notes:[],att:[],base:0,done:1};fb('按「播放新題目」開始。')}
function chord(){[0,4,7].forEach(s=>tone(s,1.1,mel.base,.2,1));return wait(1300)}
async function playMel(){await chord();await wait(150);for(const s of mel.notes)await tone(s,.55,mel.base,.35,1)}
function rAtt(){const e=$('#att');if(e)e.textContent=mel.att.map(NAME).concat(Array(Math.max(0,mel.notes.length-mel.att.length)).fill('○')).join('  ')}
function newMel(){if(busy)return;const p=MP[st.level-1],L=ML[st.level-1],n=[];let last=-1;
for(let i=0;i<L;i++){let s;do{s=pick(p)}while(s===last&&p.length>1);n.push(s);last=s}
mel={notes:n,att:[],base:Math.floor(Math.random()*9)-4,done:0};q=mel;clrFix();rAtt();fb('聽…');busy=true;playMel().then(()=>{busy=false;fb('輪到你：把剛剛的旋律彈出來。')})}
async function melKey(s){if(mode==='song')return songKey(s);if(busy||mel.done||!mel.notes.length)return;tone(s,.5,mel.base);mel.att.push(s);rAtt();
if(mel.att.length<mel.notes.length)return;mel.done=1;
const ok=mel.att.every((x,i)=>x===mel.notes[i]);
answer(ok,ok?'':'有音彈錯了。');if(!ok){showFix(mel.att,mel.notes,mel.base);return}
busy=true;await wait(1000);
busy=false;newMel()}
/* 歌曲 */
const D8=[0,2,4,5,7,9,11,12];
const SONGS=[{n:'小星星',ph:[[0,0,7,7,9,9,7],[5,5,4,4,2,2,0],[7,7,5,5,4,4,2]]},
{n:'兩隻老虎',ph:[[0,2,4,0],[4,5,7],[7,9,7,5,4,0],[0,7,0]]},
{n:'歡樂頌',ph:[[4,4,5,7],[7,5,4,2],[0,0,2,4],[4,2,2]]},
{n:'小綿羊',ph:[[4,2,0,2,4,4,4],[2,2,2],[4,7,7],[4,2,0,2,4,4,4,4],[2,2,4,2,0]]},
{n:'AI・晨光小徑 ★',ph:[[0,2,4,2],[4,7,4,2],[0,2,4,7],[4,2,0]]},
{n:'AI・雲上散步 ★★',ph:[[4,7,9,7,4],[2,4,2,0],[7,9,12,9,7],[4,2,0]]},
{n:'AI・雨後彩虹 ★★',ph:[[0,4,7,12],[11,9,7,5],[4,5,7,9,7],[5,4,2,0]]},
{n:'AI・夜行列車 ★★★',ph:[[9,11,12,14],[16,14,12,11],[9,8,9,11,12],[11,9,8,9]]},
{n:'AI・海風與星 ★★★',ph:[[-5,0,4,7],[9,7,4,0],[-3,2,5,9],[7,4,2,-1],[0,4,7]]},
{n:'AI・爵士小夜曲 ★★★★',ph:[[0,4,7,9,7],[6,7,9,12],[11,10,9,7,4],[2,4,0]]}];
let sg={i:0,p:0,custom:null,rnd:0,txt:'',acc:0};
const pSemi=t=>{const m=t.match(/([#b♯♭]?)([1-8])([+-]*)/),acc=/[#♯]/.test(m[1])?1:m[1]?-1:0,hi=(m[3].match(/\+/g)||[]).length-(m[3].match(/-/g)||[]).length;return D8[m[2]-1]+acc+12*hi};
const XS=[-5,-3,-1,0,2,4,5,7,9,11,12,14,16],XC={0:0,2:1,4:2,5:3,7:4,9:5,11:6};
function xkeysOld(){return '<div class="keys x">'+XS.map((s,i)=>{const pc=((s%12)+12)%12,n=N[XC[pc]],d=s<0?'\u0323':s>=12?'\u0307':'';
return '<button class="key" data-act="mkey" data-s="'+s+'" style="--c:'+n[2]+';height:'+(60+i*10)+'px"><b>'+n[3]+d+'</b><small>'+NAME(s)+'</small></button>'}).join('')+'</div>'}
function setAcc(v){sg.acc=sg.acc===v?0:v;const a=$('#sharp'),b=$('#flat');if(a)a.setAttribute('aria-pressed',sg.acc===1);if(b)b.setAttribute('aria-pressed',sg.acc===-1)}
const sList=()=>sg.custom?[sg.custom].concat(SONGS):SONGS;
const sNotes=()=>{const s=sList()[sg.i];return sg.p<0?[].concat(...s.ph):s.ph[sg.p]};
const chip=(k,t)=>'<button class="btn" style="min-width:0;flex:0 0 auto" data-act="sph" data-s="'+k+'" aria-pressed="'+(k===sg.p)+'">'+t+'</button>';
function rSong(){const L=sList(),s=L[sg.i];
$('#view').innerHTML='<p class="hint">選一首熟悉的歌，一句一句聽、一句一句彈。每句彈對才會換下一句，卡住時可以按「亮燈提示」。「AI・」開頭的是 AI 原創旋律，★ 越多越難。</p><div class="row">'+L.map((x,i)=>'<button class="btn" style="min-width:0;flex:0 0 auto" data-act="spick" data-s="'+i+'" aria-pressed="'+(i===sg.i)+'">'+x.n+'</button>').join('')+'</div>'
+'<div class="row">'+s.ph.map((_,k)=>chip(k,'第'+(k+1)+'句')).join('')+chip(-1,'整首')+'</div>'
+'<div class="big" id="att"></div><div class="fb" id="fb">點上面的「第幾句」開始。</div>'+xkeys()
+'<div class="row"><button class="btn main" data-act="splay">再聽一次</button><button class="btn" data-act="shint">亮燈提示</button></div>'
+'<div class="row"><button class="btn" data-act="mbase">再聽基準和弦</button><button class="btn" data-act="mclear">清除重彈</button></div>'
+'<label class="hint"><input type="checkbox" id="rnd"'+(sg.rnd?' checked':'')+'> 每次隨機換調（練相對音感，難度較高）</label>'
+'<p class="hint">想練別首歌？貼上唱名數字（1 到 7；後面加 + 是高八度、- 是低八度；前面加 # 是升半音、b 是降半音，例如 #4+ 或 b7-），用 | 或換行分句：</p><textarea id="cust" rows="3" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font:inherit"></textarea><div class="row"><button class="btn" data-act="scustom">用我的旋律</button></div>';
$('#cust').value=sg.txt;sg.acc=0;mel={notes:[],att:[],base:0,done:1}}
function songStart(re){if(busy)return;clrFix();const r=$('#rnd');sg.rnd=r?(r.checked?1:0):sg.rnd;const n=sNotes();if(!n)return;
mel={notes:n,att:[],base:re&&mel.notes.length?mel.base:(sg.rnd?Math.floor(Math.random()*9)-4:0),done:0};q=mel;rAtt();fb('聽…');busy=true;playMel().then(()=>{busy=false;fb('輪到你彈。')})}
async function songHint(){if(busy||!mel.notes.length)return;clrFix();busy=true;mel.att=[];mel.done=0;rAtt();await chord();await wait(150);for(const s of mel.notes)await tone(s,.55,mel.base);busy=false;fb('輪到你彈。')}
async function songKey(s){if(busy||mel.done||!mel.notes.length)return;s+=sg.acc;if(sg.acc)setAcc(sg.acc);tone(s,.5,mel.base);mel.att.push(s);rAtt();
if(mel.att.length<mel.notes.length)return;mel.done=1;busy=true;
const ok=mel.att.every((x,i)=>x===mel.notes[i]);
if(ok){fb('答對了！','ok');rpg(true,20);await wait(900);const n=sList()[sg.i].ph.length;busy=false;
if(sg.p>=0&&sg.p<n-1){sg.p++;rSong();songStart()}else{fb('這一段練完了！可以選「整首」，或換一首歌。','ok');bonus(30,'🎼 整首過關！額外獎勵 +30 XP')}}
else{fb('這一句有音彈錯了。','bad');rpg(false,0);showFix(mel.att,mel.notes,mel.base);busy=false}}
function songCustom(){sg.txt=$('#cust').value;const ph=[];
sg.txt.split(/[|\n,，]+/).forEach(t=>{const a=(t.match(/[#b♯♭]?[1-8][+-]*/g)||[]).map(pSemi),k=a.length>6?4:a.length;for(let i=0;i<a.length;i+=k)ph.push(a.slice(i,i+k))});
if(!ph.length){fb('請輸入唱名數字，例如 1 1 5 5 6 6 5。','bad');return}
sg.custom={n:'我的旋律',ph};sg.i=0;sg.p=0;rSong();songStart()}
/* 跟唱 */
let target=0,hold=0;
function detect(buf,sr){const n=buf.length;let r=0;for(let i=0;i<n;i++)r+=buf[i]*buf[i];if(Math.sqrt(r/n)<.012)return -1;
const lo=Math.floor(sr/1000),hi=Math.floor(sr/70),c=new Float32Array(hi+2);let mx=0;
for(let l=lo;l<=hi;l++){let s=0;for(let i=0;i<n-l;i++)s+=buf[i]*buf[i+l];c[l]=s;if(s>mx)mx=s}
for(let l=lo+1;l<hi;l++){if(c[l]>.85*mx&&c[l]>=c[l-1]&&c[l]>=c[l+1])return sr/l}return -1}
async function startMic(){stopMic();
try{const s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
const c=A(),src=c.createMediaStreamSource(s),an=c.createAnalyser();an.fftSize=2048;src.connect(an);mic={s,an,buf:new Float32Array(2048)};hold=0;fb('唱出目標音吧。');loop()}
catch(e){fb('無法使用麥克風。請在瀏覽器網址列允許麥克風權限，或用手機瀏覽器直接開啟此頁。','bad')}}
function stopMic(){cancelAnimationFrame(raf);if(mic){mic.s.getTracks().forEach(t=>t.stop());mic=null}}
function loop(){if(!mic)return;mic.an.getFloatTimeDomainData(mic.buf);const f=detect(mic.buf,ctx.sampleRate);const nd=$('#nd');
if(f>0){const semi=12*Math.log2(f/261.63);let d=((semi-target+6)%12+12)%12-6;const cents=d*100;
nd.style.left=(50+Math.max(-100,Math.min(100,cents))/100*45)+'%';
if(Math.abs(cents)<30){hold++;fb('很準！保持住…','ok');if(hold>45){fb('成功！你唱準了 '+NAME(target)+'。','ok');hold=0;mic&&(mic.done=1)}}
else{hold=0;fb(cents>0?'偏高了，往下一點':'偏低了，往上一點','bad')}}
else{nd.style.left='50%'}
raf=requestAnimationFrame(loop)}
/* 事件 */
document.addEventListener('click',async e=>{
const t=e.target.closest('[data-tab]');if(t){setMode(t.dataset.tab);return}
const ins=e.target.closest('[data-inst]');if(ins){setInst(ins.dataset.inst);return}
const ld=e.target.closest('[data-land]');if(ld){const on=document.body.classList.toggle('land');ld.setAttribute('aria-pressed',on);return}
const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,s=+b.dataset.s;
if(a==='play'){tone(s,1)}
else if(a==='scale'){if(busy)return;busy=true;for(const n of N)await tone(n[1],.45);busy=false}
else if(a==='next'){if(!busy)newQ()}
else if(a==='replay'){if(q&&!busy)playQ()}
else if(a==='guess')guess(s);
else if(a==='up'||a==='down'||a==='same')pitchAns(a);
else if(a==='mkey')melKey(s);else if(a==='mlv'){if(!busy){st.level=s;rMel()}}else if(a==='fplay')fPlay(s);else if(a==='fretry')fRetry();else if(a==='fnext')fNext();else if(a==='spick'){sg.i=s;sg.p=0;rSong()}else if(a==='sph'){sg.p=s;rSong();songStart()}else if(a==='splay')songStart(1);else if(a==='shint')songHint();else if(a==='scustom')songCustom();else if(a==='acc')setAcc(s);else if(a==='mclear'){if(!mel.done&&!busy){mel.att=[];rAtt()}}else if(a==='mbase'){if(!busy){busy=true;await chord();busy=false}}
else if(a==='target'){target=s;$('#tg').textContent='目標：'+NAME(s);tone(s,1)}
else if(a==='mic'){await tone(target,1);startMic()}
else if(a==='stop'){stopMic();fb('已停止。')}});
try{inst=localStorage.getItem('inst')==='guitar'?'guitar':'piano'}catch(e){}document.addEventListener('pointerdown',()=>{try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}const c=A(),b=c.createBuffer(1,1,22050),s=c.createBufferSource();s.buffer=b;s.connect(c.destination);s.start(0)},{once:true});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ctx&&ctx.state!=='running')ctx.resume()});
syncInst();tabs();render();drawRpg();$('#rmsg').textContent=R.total?'歡迎回來，繼續練習吧！':'從今天開始，讓耳朵一天比一天強！';
</script>
